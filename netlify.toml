[build]
  publish = "files"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; form-action https://formspree.io"
